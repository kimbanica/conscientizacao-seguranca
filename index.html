<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta de Segurança</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { padding: 24px; }
    h1 {
      color: #ff3030;
      font-size: clamp(42px, 9vw, 90px);
      text-transform: uppercase;
      margin: 0 0 24px;
    }
    p { font-size: clamp(18px, 3vw, 26px); line-height: 1.5; }
    .aviso { color: #bfbfbf; font-size: 16px; margin-top: 38px; }
  </style>
</head>
<body>
  <main>
    <h1>Você foi hackeado!</h1>
    <p>Você acabou de escanear um QR Code sem saber para onde ele levava.</p>
    <p><strong>Pense antes de clicar ou escanear.</strong></p>
    <p class="aviso">Simulação educativa de conscientização em segurança cibernética.<br>Nenhum dispositivo foi invadido por esta página.</p>
  </main>
</body>
</html>
